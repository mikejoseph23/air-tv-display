name: AirTVDisplay
options:
  bundleIdPrefix: net.iadev
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
settings:
  base:
    # Single variable for the third-party dependency location (OpenSSL + libplist), built
    # universal (arm64 + x86_64) by scripts/setup-deps.sh. Repoint with:
    #   xcodebuild ... AIRTV_DEPS_PREFIX=/other/prefix
    AIRTV_DEPS_PREFIX: $(HOME)/.cache/airtv-deps/universal
    UXPLAY_SRC: $(SRCROOT)/thirdparty/UxPlay
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
  configs:
    # Release builds are universal; Debug stays active-arch only.
    Release:
      ARCHS: arm64 x86_64
      ONLY_ACTIVE_ARCH: NO
targets:
  UxPlayLib:
    type: library.static
    platform: macOS
    sources:
      - path: thirdparty/UxPlay/lib
        includes:
          - "*.c"
          - "*.h"
          - "playfair/*.c"
          - "playfair/*.h"
          - "llhttp/*.c"
          - "llhttp/*.h"
          - "dns_sd/dns_sd.c"
    settings:
      base:
        PRODUCT_NAME: uxplaylib
        GCC_PREPROCESSOR_DEFINITIONS: "NOHOLD=1 PLIST_210=1 PLIST_230=1"
        HEADER_SEARCH_PATHS:
          - $(UXPLAY_SRC)/lib
          - $(UXPLAY_SRC)/lib/playfair
          - $(UXPLAY_SRC)/lib/llhttp
        # Vendored third-party C: do not fail on its warnings.
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        # -idirafter (not -I): the env include dir carries ncurses headers that shadow system ones.
        OTHER_CFLAGS: "-O2 -fno-common -idirafter $(AIRTV_DEPS_PREFIX)/include"
        SKIP_INSTALL: YES
  AirTVDisplay:
    type: application
    platform: macOS
    sources:
      - path: AirTVDisplay
        excludes:
          - Info.plist
      # Shipped in Contents/Resources (GPLv3 requires the license to travel with the binary).
      - path: LICENSE
        buildPhase: resources
      - path: thirdparty/LICENSES.md
        buildPhase: resources
    dependencies:
      - target: UxPlayLib
        link: true
      - package: Sparkle
    # AirTVDisplay/Info.plist is hand-edited and the single source of truth for the version
    # (CFBundleShortVersionString / CFBundleVersion) and Sparkle's SU* keys; the release
    # scripts read it. Not generated by xcodegen.
    entitlements:
      path: AirTVDisplay/AirTVDisplay.entitlements
      properties:
        # No App Sandbox: UxPlay's C code opens its own listening sockets and reads en0's MAC,
        # and Sparkle's installer runs unsandboxed. Under the hardened runtime nothing else is
        # needed: libcrypto and Sparkle are signed with the same identity (library validation
        # passes), audio output needs no entitlement, and there is no JIT. The two network keys
        # only take effect if the sandbox is ever turned on.
        com.apple.security.app-sandbox: false
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    postBuildScripts:
      - name: Embed libcrypto
        basedOnDependencyAnalysis: false
        script: |
          set -e
          FW="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$FW"
          cp -f "$AIRTV_DEPS_PREFIX/lib/libcrypto.3.dylib" "$FW/libcrypto.3.dylib"
          chmod u+w "$FW/libcrypto.3.dylib"
          codesign --force --sign - "$FW/libcrypto.3.dylib"
          codesign --force --sign - "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iadev.AirTVDisplay
        PRODUCT_NAME: AirTVDisplay
        INFOPLIST_FILE: AirTVDisplay/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: AirTVDisplay/AirTVDisplay-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: NO
        HEADER_SEARCH_PATHS:
          - $(UXPLAY_SRC)/lib
          - $(UXPLAY_SRC)/lib/playfair
          - $(UXPLAY_SRC)/lib/llhttp
        OTHER_SWIFT_FLAGS: "-Xcc -idirafter -Xcc $(AIRTV_DEPS_PREFIX)/include"
        LIBRARY_SEARCH_PATHS:
          - $(AIRTV_DEPS_PREFIX)/lib
        OTHER_LDFLAGS:
          - $(AIRTV_DEPS_PREFIX)/lib/libplist-2.0.a
          - -lcrypto
        # libplist is linked statically. conda-forge has no static libcrypto, so libcrypto.3.dylib
        # is copied into Contents/Frameworks and re-signed by the postBuild script below.
        ENABLE_DEBUG_DYLIB: NO
        LD_RUNTIME_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
  # Unhosted logic tests: compiles the testable app sources directly (hosting inside the app
  # breaks the app target's re-sign postBuild script once XCTest frameworks are injected).
  AirTVDisplayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Fixtures are read from the source tree (#filePath), not bundled.
      - path: Tests
        excludes:
          - "Fixtures/**"
      - AirTVDisplay/NetworkInfo.swift
      - AirTVDisplay/BonjourRegistrar.swift
      - AirTVDisplay/UxPlayBridge.swift
      - AirTVDisplay/RaopServer.swift
      - AirTVDisplay/RtspLog.swift
      - AirTVDisplay/AnnexB.swift
      - AirTVDisplay/StreamDump.swift
      - AirTVDisplay/ReceiverState.swift
      - AirTVDisplay/AudioDecoder.swift
      - AirTVDisplay/AudioTiming.swift
      - AirTVDisplay/AudioRenderer.swift
      - AirTVDisplay/VideoFormat.swift
      - AirTVDisplay/VideoStats.swift
      - AirTVDisplay/VideoDecoder.swift
      - AirTVDisplay/VideoRenderer.swift
      - AirTVDisplay/VideoPipeline.swift
      - AirTVDisplay/AVSync.swift
      - AirTVDisplay/DisplaySleepGuard.swift
      - AirTVDisplay/AppSettings.swift
    dependencies:
      - target: UxPlayLib
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iadev.AirTVDisplayTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: AirTVDisplay/AirTVDisplay-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(UXPLAY_SRC)/lib
          - $(UXPLAY_SRC)/lib/playfair
          - $(UXPLAY_SRC)/lib/llhttp
        OTHER_SWIFT_FLAGS: "-Xcc -idirafter -Xcc $(AIRTV_DEPS_PREFIX)/include"
        LIBRARY_SEARCH_PATHS:
          - $(AIRTV_DEPS_PREFIX)/lib
        OTHER_LDFLAGS:
          - $(AIRTV_DEPS_PREFIX)/lib/libplist-2.0.a
          - -lcrypto
          - -Wl,-rpath,$(AIRTV_DEPS_PREFIX)/lib
